<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volts RolePlay</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #332900, transparent 50%),
        linear-gradient(135deg, #050505, #171717);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    font-size: 34px;
    letter-spacing: 4px;
    margin: 0;
}

.logo h1 span {
    color: #ffcc00;
}

.logo p {
    color: #aaa;
    font-size: 11px;
    letter-spacing: 3px;
}

.panel {
    background: #111;
    border: 1px solid #383838;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 0 30px #000;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tabs button {
    flex: 1;
    padding: 13px;
    background: #222;
    border: 1px solid #333;
    color: white;
    border-radius: 7px;
    font-weight: bold;
}

.tabs button.active {
    background: #ffcc00;
    color: black;
    border-color: #ffcc00;
}

h2 {
    margin-bottom: 7px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    margin-bottom: 22px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    background: #080808;
    border: 1px solid #383838;
    border-radius: 7px;
    color: white;
    outline: none;
}

input:focus {
    border-color: #ffcc00;
}

.row {
    display: flex;
    gap: 10px;
}

.row div {
    width: 50%;
}

.action {
    width: 100%;
    padding: 15px;
    margin-top: 23px;
    background: #ffcc00;
    color: #111;
    border: none;
    border-radius: 7px;
    font-weight: 900;
    letter-spacing: 1px;
}

.action:active {
    opacity: .8;
}

.notice {
    color: #ffcc00;
    font-size: 12px;
    text-align: center;
    margin-top: 15px;
    min-height: 16px;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 10px;
    margin-top: 22px;
    letter-spacing: 2px;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1><span>VOLTS</span> RP</h1>
        <p>SUA HISTÓRIA COMEÇA AQUI</p>
    </div>

    <div class="panel">

        <div class="tabs">
            <button id="loginTab" class="active">ENTRAR</button>
            <button id="registerTab">REGISTRAR</button>
        </div>

        <form id="loginForm">

            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">
                Entre na sua conta para jogar.
            </p>

            <label>NOME DO PERSONAGEM</label>
            <input id="loginName"
                placeholder="Ex.: Dan_TK"
                required>

            <label>SENHA</label>
            <input id="loginPassword"
                type="password"
                placeholder="Sua senha"
                required>

            <button class="action" type="submit">
                ENTRAR NO SERVIDOR
            </button>

        </form>

        <form id="registerForm" hidden>

            <h2>Crie sua conta</h2>
            <p class="subtitle">
                Cadastre seu personagem no Volts RP.
            </p>

            <div class="row">
                <div>
                    <label>NOME</label>
                    <input id="firstName"
                        placeholder="Nome"
                        required>
                </div>

                <div>
                    <label>SOBRENOME</label>
                    <input id="lastName"
                        placeholder="Sobrenome"
                        required>
                </div>
            </div>

            <label>SENHA</label>
            <input id="registerPassword"
                type="password"
                minlength="6"
                placeholder="Mínimo 6 caracteres"
                required>

            <label>CONFIRMAR SENHA</label>
            <input id="confirmPassword"
                type="password"
                minlength="6"
                placeholder="Repita sua senha"
                required>

            <button class="action" type="submit">
                CRIAR CONTA
            </button>

        </form>

        <div class="notice" id="notice"></div>

    </div>

    <div class="footer">
        VOLTS ROLEPLAY • CONECTE-SE E VIVA SUA HISTÓRIA
    </div>

</div>

<script>
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const notice = document.getElementById("notice");

function showLogin() {
    loginForm.hidden = false;
    registerForm.hidden = true;

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    notice.textContent = "";
}

function showRegister() {
    loginForm.hidden = true;
    registerForm.hidden = false;

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    notice.textContent = "";
}

loginTab.type = "button";
registerTab.type = "button";

loginTab.addEventListener("click", showLogin);
registerTab.addEventListener("click", showRegister);

loginForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const username =
        document.getElementById("loginName").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!window.cef || typeof window.cef.emit !== "function") {
        notice.textContent = "Conexão CEF indisponível!";
        return;
    }

    window.cef.emit("volts:login", {
        username: username,
        password: password
    });

    notice.textContent = "Solicitação de login enviada!";
});

registerForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        notice.textContent = "As senhas não são iguais!";
        return;
    }

    if (!window.cef || typeof window.cef.emit !== "function") {
        notice.textContent = "Conexão CEF indisponível!";
        return;
    }

    window.cef.emit("volts:register", {
        firstName: firstName,
        lastName: lastName,
        password: password
    });

    notice.textContent = "Solicitação de cadastro enviada!";
});

showLogin();
</script>
</body>
</html>
