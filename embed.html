<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volts RP • Avisos</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.stage{position:fixed;inset:0;pointer-events:none;display:flex;align-items:flex-start;justify-content:flex-end;padding:8vh 3vw 0}.stack{width:min(390px,92vw);display:flex;flex-direction:column;gap:12px;align-items:stretch}.notice{--accent:#e52d40;position:relative;overflow:hidden;opacity:0;transform:translateX(115%) scale(.97);border:1px solid color-mix(in srgb,var(--accent),transparent 48%);border-left:5px solid var(--accent);border-radius:13px;background:linear-gradient(135deg,rgba(22,25,34,.98),rgba(9,11,16,.98));box-shadow:0 18px 55px rgba(0,0,0,.52),0 0 28px color-mix(in srgb,var(--accent),transparent 84%);color:#f6f7fa;animation:enter .42s cubic-bezier(.2,.85,.25,1) forwards}.notice.leaving{animation:leave .32s ease-in forwards}.top{display:flex;align-items:center;gap:10px;padding:13px 15px 9px}.symbol{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:11px;background:color-mix(in srgb,var(--accent),transparent 84%);border:1px solid color-mix(in srgb,var(--accent),transparent 60%);font-size:24px}.brand{font-size:9px;letter-spacing:1.7px;font-weight:900;color:#aeb5c2}.kind{margin-top:4px;font-size:8px;letter-spacing:1.2px;color:var(--accent);font-weight:900;text-transform:uppercase}.live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.content{padding:1px 16px 13px 67px}.title{font-size:16px;line-height:1.25;font-weight:900;letter-spacing:.25px;text-transform:uppercase;overflow-wrap:anywhere}.message{margin-top:7px;font-size:12px;line-height:1.55;color:#cbd0d9;white-space:pre-wrap;overflow-wrap:anywhere}.footer{margin:0 15px 0 67px;padding:9px 0 11px;border-top:1px solid rgba(255,255,255,.09);font-size:8px;letter-spacing:1.2px;color:#858d9a}.footer b{color:#e8ebf1}.progress{height:3px;background:rgba(255,255,255,.07)}.bar{height:100%;width:100%;transform-origin:left;background:var(--accent);animation:shrink linear forwards}.notice:after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);transform:skewX(-20deg);pointer-events:none}@keyframes enter{to{opacity:1;transform:translateX(0) scale(1)}}@keyframes leave{to{opacity:0;transform:translateX(115%) scale(.97)}}@keyframes shrink{to{transform:scaleX(0)}}@media(max-width:520px){.stage{padding:5vh 3vw 0}.stack{width:min(360px,94vw)}.title{font-size:14px}.message{font-size:11px}}
</style>
</head>
<body>
<div class="stage"><div class="stack" id="stack" aria-live="polite"></div></div>
<script>
(()=>{
 const stack=document.getElementById('stack');const queue=[];let active=false,hideTimer=null;
 const themes={admin:{label:'Comunicado administrativo',color:'#e52d40',icon:'📢'},policia:{label:'Comunicado policial',color:'#3288ff',icon:'🚔'},guerra:{label:'Alerta de conflito',color:'#f05a28',icon:'⚔️'},prefeitura:{label:'Comunicado da prefeitura',color:'#c5a34a',icon:'🏛️'},festa:{label:'Evento / Festa',color:'#b45cff',icon:'🎉'},custom:{label:'Comunicado especial',color:'#e52d40',icon:'✨'}};
 function parseData(value){if(typeof value==='string'){try{return JSON.parse(value)}catch(e){return {message:value}}}return value||{}}
 function show(data){const d=parseData(data);if(!d.title&&!d.message)return;queue.push(d);processQueue()}
 function processQueue(){if(active||!queue.length)return;active=true;const d=queue.shift(),theme=themes[d.category]||themes.admin,duration=Math.max(2000,Math.min(15000,Number(d.duration)||4000)),color=/^#[0-9a-fA-F]{6}$/.test(d.color||'')?d.color:theme.color;
 const card=document.createElement('section');card.className='notice';card.style.setProperty('--accent',color);
 const top=document.createElement('div');top.className='top';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=d.icon||theme.icon;const brand=document.createElement('div');const b=document.createElement('div');b.className='brand';b.textContent='VOLTS ROLEPLAY';const kind=document.createElement('div');kind.className='kind';kind.textContent=theme.label;brand.append(b,kind);const live=document.createElement('i');live.className='live';top.append(symbol,brand,live);
 const content=document.createElement('div');content.className='content';const title=document.createElement('div');title.className='title';title.textContent=d.title||'COMUNICADO';const message=document.createElement('div');message.className='message';message.textContent=d.message||'';content.append(title,message);
 const footer=document.createElement('div');footer.className='footer';footer.append('ENVIADO POR ');const author=document.createElement('b');author.textContent=d.author||'EQUIPE VOLTS';footer.append(author);
 const progress=document.createElement('div');progress.className='progress';const bar=document.createElement('div');bar.className='bar';bar.style.animationDuration=duration+'ms';progress.append(bar);card.append(top,content,footer,progress);stack.append(card);
 requestAnimationFrame(()=>card.classList.add('visible'));
 clearTimeout(hideTimer);hideTimer=setTimeout(()=>{card.classList.add('leaving');setTimeout(()=>{card.remove();active=false;processQueue()},340)},duration);
 }
 function hide(){clearTimeout(hideTimer);queue.length=0;const cards=[...stack.children];cards.forEach(c=>c.classList.add('leaving'));setTimeout(()=>{stack.replaceChildren();active=false},350)}
 function register(){if(!window.cef||typeof window.cef.on!=='function')return false;window.cef.on('volts:embedShow',show);window.cef.on('volts:embedHide',hide);return true}
 let tries=0;const timer=setInterval(()=>{tries++;if(register()||tries>=120)clearInterval(timer)},100);
 window.VoltsEmbed={show,hide};
})();
</script>
</body>
</html>
